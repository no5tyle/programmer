# On every push to main: build the site folder, run the tests against exactly that folder, then deploy it to
# Firebase Hosting (program.qstored.org), signing in to Google without stored keys (Workload Identity Federation).
# If a test fails, the live site isn't touched. The deploy is skipped until the repository's variables are set:
# PROJECT, WIF_PROVIDER and DEPLOY_SA (see the README, "Hosting").
# The ?v= tags on the CSS and JS links are set to the commit, so browsers always load matching files after an update.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the site folder with version tags from the commit
        run: |
          mkdir _site
          cp -r index.html css js assets examples _site/
          # Only rewrite real version tags on links, e.g. css/app.css?v=20261111-6
          sed -i -E "s/(\.(css|js))\?v=[A-Za-z0-9.-]+\"/\1?v=${GITHUB_SHA::8}\"/g" _site/index.html
          # Every stylesheet and script link of the app's own (css/, js/) must carry the new tag, and nothing else may change.
          links="$(grep -cE '"(css|js)/[^"?]+\.(css|js)[?"]' index.html)"
          test "$links" -ge 5
          test "$(grep -c "?v=${GITHUB_SHA::8}\"" _site/index.html)" -eq "$links"
          diff <(sed -E 's/\?v=[A-Za-z0-9.-]+"/?v="/g' index.html) <(sed -E 's/\?v=[A-Za-z0-9.-]+"/?v="/g' _site/index.html)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test the built site
        run: npx playwright test
        env:
          SITE_ROOT: _site
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      # After the tests, which run with accounts off (tests/account*.spec.js turn them on with their own settings).
      - name: Fill in the account settings (js/config.js) from the repository's variables
        # Accounts stay off until API_BASE and FIREBASE_API_KEY are set (Settings → Secrets and variables → Variables).
        env:
          SETTINGS: ${{ toJSON(vars) }}
        run: |
          node -e '
            const v = JSON.parse(process.env.SETTINGS || "{}");
            const settings = {
              apiBase: v.API_BASE || "", firebaseApiKey: v.FIREBASE_API_KEY || "", supportEmail: v.SUPPORT_EMAIL || "",
              privacyUrl: v.PRIVACY_URL || "", termsUrl: v.TERMS_URL || "",
              microsoftSignIn: v.MICROSOFT_SIGN_IN === "true",
            };
            require("fs").writeFileSync("_site/js/config.js", `window.QSTORED_CONFIG = Object.assign(${JSON.stringify(settings)}, window.QSTORED_CONFIG);\n`);
          '
      - uses: google-github-actions/auth@v2
        if: vars.PROJECT != ''
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - name: Deploy to Firebase Hosting
        if: vars.PROJECT != ''
        run: npx --yes firebase-tools@15 deploy --only hosting --project "${{ vars.PROJECT }}" --non-interactive
